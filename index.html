<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QW Election Assistant</title>
    
    <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">
    
    <style>
        body { margin: 0; font-family: 'Google Sans', Arial, sans-serif; background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; }

        /* REFINED RESET BUTTON - Larger and Clearer */
        #chat-reset-trigger {
            position: fixed;
            /* ADJUST THESE TWO VALUES TO ALIGN WITH YOUR IMAGE */
            bottom: 585px; 
            right: 85px; 

            display: none; /* Controlled by JS */
            align-items: center;
            gap: 8px;
            
            /* Professional Look */
            background-color: #ffffff;
            color: #1a73e8; /* Quinte West / Google Blue */
            border: 1px solid #1a73e8;
            border-radius: 8px;
            padding: 4px 16px; /* Larger hit area */
            
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            z-index: 2147483647; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s ease-in-out;
            white-space: nowrap;
        }

        #chat-reset-trigger:hover {
            background-color: #1a73e8;
            color: white;
            transform: translateY(-1px);
        }

        #chat-reset-trigger.visible { display: flex; }

        df-messenger {
            z-index: 999;
            position: fixed;
            bottom: 16px;
            right: 16px;
            --df-messenger-font-family: 'Google Sans';
            --df-messenger-header-color: #1a73e8;
        }
    </style>
</head>
<body>

    <button id="chat-reset-trigger" onclick="clearResidentChat()">
        🔄 RESTART CONVERSATION
    </button>

    <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>
    
    <df-messenger
      project-id="election-chat-487118"
      agent-id="c2b9ac64-7a14-4afa-b72b-ba3ffda7d872"
      language-code="en">
      <df-messenger-chat-bubble chat-title="QW Election Chat v3"></df-messenger-chat-bubble>
    </df-messenger>

    <script>
      const messenger = document.querySelector('df-messenger');
      const resetBtn = document.getElementById('chat-reset-trigger');

      messenger.addEventListener('df-chat-open-changed', (event) => {
        if (event.detail.isOpen) {
            resetBtn.classList.add('visible');
            const history = JSON.parse(localStorage.getItem('df-messenger-history') || '[]');
            if (history.length === 0) {
                setTimeout(() => { messenger.sendQuery('Hello'); }, 600);
            }
        } else {
            resetBtn.classList.remove('visible');
        }
      });

      function clearResidentChat() {
        if (confirm("Would you like to restart the conversation? This clears all current search results.")) {
            messenger.clearStorage();
            window.location.reload(); 
        }
      }
    </script>
</body>
</html>
